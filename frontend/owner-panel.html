
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#080808">

    <title>Owner Panel | Prabhas Fan Hub</title>

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
        rel="stylesheet"
        href="css/loading.css">

    <link
        rel="stylesheet"
        href="css/owner.css">
</head>

<body>

    <!-- Loading Screen -->
    <div id="appLoader" class="app-loader">

        <div class="loader-content">

            <div class="loader-ring"></div>

            <p>PRABHAS FAN HUB</p>

            <div class="loading-line">
                <span></span>
            </div>

        </div>

    </div>

    <!-- Owner Panel -->
    <main class="owner-panel-page">

        <section class="owner-panel">

            <!-- Header -->
            <div class="owner-panel-header">

                <div>
                    <p class="owner-label">
                        PRIVATE AREA
                    </p>

                    <h1>Owner Panel</h1>

                    <p class="owner-welcome">
                        Welcome, Owner
                    </p>
                </div>

                <button
                    type="button"
                    id="logoutButton"
                    class="logout-button">

                    Logout

                </button>

            </div>

            <!-- Management Cards -->
            <div class="management-grid">

                <!-- Movies -->
                <div class="management-card">

                    <div class="management-icon">
                        🎬
                    </div>

                    <h2>Movies</h2>

                    <p>
                        Add and manage Prabhas movies.
                    </p>

                    <button
                        type="button"
                        id="addMoviesButton"
                        class="manage-button">

                        Add Movies

                    </button>

                    <button
                        type="button"
                        id="allMoviesButton"
                        class="manage-button">

                        All Movies

                    </button>

                </div>

                <!-- Songs -->
                <div class="management-card">

                    <div class="management-icon">
                        🎵
                    </div>

                    <h2>Songs</h2>

                    <p>
                        Add and manage Prabhas songs.
                    </p>

                    <button
                        type="button"
                        id="addSongsButton"
                        class="manage-button">

                        Add Songs

                    </button>

                    <button
                        type="button"
                        id="allSongsButton"
                        class="manage-button">

                        All Songs

                    </button>

                </div>

                <!-- Wallpapers -->
                <div class="management-card">

                    <div class="management-icon">
                        🖼️
                    </div>

                    <h2>Wallpapers</h2>

                    <p>
                        Upload, view and manage Prabhas wallpapers.
                    </p>

                    <button
                        type="button"
                        id="addWallpapersButton"
                        class="manage-button">

                        Add Wallpapers

                    </button>

                    <button
                        type="button"
                        id="allWallpapersButton"
                        class="manage-button">

                        All Wallpapers

                    </button>

                </div>

                <!-- News -->
                <div class="management-card">

                    <div class="management-icon">
                        📰
                    </div>

                    <h2>News</h2>

                    <p>
                        Add and manage Prabhas news.
                    </p>

                    <button
                        type="button"
                        id="manageNewsButton"
                        class="manage-button">

                        Manage News

                    </button>

                </div>

            </div>

        </section>

    </main>

    <!-- Scripts -->
    <script src="js/loading.js"></script>

    <script src="js/owner-panel.js"></script>

</body>

</html>
