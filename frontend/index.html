
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prabhas Fan Hub | Official Fan Community</title>

    <meta name="theme-color" content="#100d12">
    <meta name="description" content="Explore Prabhas movies, songs, wallpapers and latest fan news on Prabhas Fan Hub.">

    <!-- App Logo -->
    <link rel="icon" type="image/png" href="assets/app/logo.png">
    <link rel="shortcut icon" type="image/png" href="assets/app/logo.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/loading.css">
</head>

<body class="home-page">

    <!-- LOADING SCREEN -->
    <div id="appLoader" class="app-loader">
        <div class="loader-content">

            <img
                src="assets/app/logo.png"
                alt="Prabhas Fan Hub Logo"
                class="loader-logo"
            >

            <div class="loader-ring"></div>

            <p>PRABHAS FAN HUB</p>

            <div class="loading-line">
                <span></span>
            </div>

        </div>
    </div>

    <!-- NAVIGATION -->
    <header class="navbar">

        <a href="index.html" class="logo" aria-label="Prabhas Fan Hub Home">

            <img
                src="assets/app/logo.png"
                alt="Prabhas Fan Hub Logo"
                class="nav-logo"
            >

            <span class="logo-text">
                <strong>PRABHAS</strong>
                <small>FAN HUB</small>
            </span>

        </a>

        <nav aria-label="Main navigation">

            <a href="index.html" class="active">Home</a>

            <a href="movies.html">Movies</a>

            <a href="songs.html">Songs</a>

            <a href="wallpapers.html">Wallpapers</a>

            <a href="news.html">News</a>

        </nav>

    </header>

    <!-- MAIN CONTENT -->
    <main>

        <!-- HERO SECTION -->
        <section class="hero">

            <div class="hero-overlay"></div>

            <div class="hero-content">

                <div class="hero-badge">
                    <span class="hero-badge-line"></span>
                    THE REBEL STAR
                    <span class="hero-badge-line"></span>
                </div>

                <h1>PRABHAS</h1>

                <div class="hero-divider">
                    <span></span>
                    <span class="hero-divider-star">✦</span>
                    <span></span>
                </div>

                <p class="hero-description">
                    Celebrating the journey, movies and legacy
                    of India's Darling.
                </p>

                <button
                    type="button"
                    class="hero-button"
                    onclick="window.location.href='movies.html'">

                    <span>Explore Movies</span>

                    <span class="button-arrow" aria-hidden="true">→</span>

                </button>

            </div>

            <div class="hero-bottom-label">
                <span class="hero-bottom-dot"></span>
                A WORLD OF PRABHAS
            </div>

        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script src="js/app.js"></script>
    <script src="js/loading.js"></script>

</body>
</html>
